services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://newsdc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/newsdc
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
      INGESTION_INTERVAL_MS: ${INGESTION_INTERVAL_MS:-1800000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:5000:5000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newsdc
      POSTGRES_USER: newsdc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55434}:5432'
    volumes:
      - newsdc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newsdc -d newsdc']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  newsdc_pgdata:
